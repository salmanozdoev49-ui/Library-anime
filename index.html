<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Библиотека аниме</title>
<style>
:root{--bg:#090909;--panel:#151515;--text:#f4f4f4;--muted:#999;--red:#d71920;--border:#292929}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:82px}header{padding:22px 18px 12px}
h1{font-size:28px;margin:0 0 17px}.add-btn{width:100%;height:44px;margin:0 0 10px;background:var(--red);color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}.search{width:100%;height:46px;background:#111;color:#fff;border:1px solid var(--border);border-radius:13px;padding:0 15px;font-size:16px;outline:0}
.page{display:none;padding:8px 18px}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#1b1b1b;border:1px solid #292929;cursor:pointer}.card img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#000)}
.title{position:absolute;bottom:0;left:0;right:0;padding:24px 8px 10px;text-align:center;font-size:14px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:50px 10px}.section-title{font-size:22px;margin:8px 0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px}.tab{white-space:nowrap;background:#151515;color:#ddd;border:1px solid var(--border);border-radius:10px;padding:10px 13px}.tab.active{background:var(--red);border-color:var(--red)}
.profile{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:20px}.stat{display:flex;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--border)}.stat:last-child{border:0}.stat span:last-child{font-size:22px;font-weight:800;color:#ff3038}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);z-index:20}.nav{width:min(1100px,100%);margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{height:66px;background:0;border:0;color:#888;font-size:13px}.nav button b{display:block;font-size:22px;margin-bottom:4px}.nav button.active{color:#fff}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.modal.show{display:flex}.modal-box{width:min(520px,100%);max-height:93vh;overflow:auto;background:#151515;border:1px solid #303030;border-radius:20px;padding:18px;position:relative}.close{position:absolute;right:12px;top:10px;background:#222;color:white;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.poster{width:min(260px,80%);aspect-ratio:2/3;object-fit:cover;display:block;margin:12px auto 20px;border-radius:14px}.info h2{text-align:center}.info-row{padding:10px 0;border-bottom:1px solid var(--border);line-height:1.45}.label{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}.badge{display:inline-block;background:var(--red);padding:5px 9px;border-radius:8px;font-size:13px}.edit-btn,.primary,.danger{width:100%;height:46px;border:0;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}.edit-btn,.primary{background:var(--red);color:#fff}.edit-btn{margin-top:18px}.danger{background:#2a1111;color:#ff6666;margin-top:9px}label{display:block;color:#bbb;font-size:13px;margin:13px 0 0}label input,label textarea,label select{display:block;width:100%;margin-top:6px;background:#0f0f0f;color:#fff;border:1px solid var(--border);border-radius:10px;padding:11px;font-size:15px;outline:0}label textarea{resize:vertical}.form-actions{margin-top:18px}
@media(max-width:600px){header{padding:18px 14px 10px}h1{font-size:24px}.page{padding:7px 14px}.grid{gap:9px}.title{font-size:12px;padding:20px 5px 8px}.nav button{height:72px}.bottom{height:72px}}
</style>
</head>
<body>
<div class="app">
<header><h1 id="headerTitle">Библиотека аниме</h1><button class="add-btn" onclick="openEditor()">＋ Добавить аниме</button><input id="search" class="search" placeholder="🔎 Поиск аниме..." autocomplete="off"></header>
<main>
<section id="home" class="page active"><div id="homeGrid" class="grid"></div></section>
<section id="favorites" class="page"><h2 class="section-title">👍 Избранное</h2><div id="tabs" class="tabs"></div><div id="favGrid" class="grid"></div></section>
<section id="profile" class="page"><h2 class="section-title">👤 Профиль</h2><div class="profile" id="stats"></div></section>
</main></div>
<div class="bottom"><nav class="nav">
<button data-page="home" class="active"><b>🏠</b>Главная</button><button data-page="favorites"><b>👍</b>Избранное</button><button data-page="profile"><b>👤</b>Профиль</button>
</nav></div>
<div id="modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><img id="mPoster" class="poster" src="" alt=""><div class="info"><h2 id="mTitle"></h2><div class="info-row"><span class="label">Год</span><span id="mYear"></span></div><div class="info-row"><span class="label">Озвучка</span><span id="mVoice"></span></div><div class="info-row"><span class="label">Описание</span><span id="mDesc"></span></div><div class="info-row"><span class="label">Статус</span><span id="mStatus" class="badge"></span></div><button id="editBtn" class="edit-btn" onclick="editCurrent()">✏️ Изменить</button></div></div></div>

<div id="editor" class="modal"><div class="modal-box"><button class="close" onclick="closeEditor()">×</button><h2 id="editorTitle">Добавить аниме</h2><form id="animeForm"><input type="hidden" id="fId"><label>Название<input id="fTitle" required></label><label>Год<input id="fYear" type="number"></label><label>Озвучка<input id="fVoice"></label><label>Постер (ссылка)<input id="fPoster" type="url"></label><label>Описание<textarea id="fDesc" rows="5"></textarea></label><label>Статус<select id="fStatus"><option>Просмотрено</option><option>Планирую</option><option>Анонс</option><option>Закончено</option><option>Жду продолжение</option></select></label><div class="form-actions"><button type="submit" class="primary">💾 Сохранить</button><button type="button" class="danger" id="deleteBtn" onclick="deleteCurrent()">🗑️ Удалить</button></div></form></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ================= SUPABASE =================
// ВСТАВЬ СЮДА данные своего проекта.
// Используй Publishable key (или старый anon key). НИКОГДА не вставляй service_role/secret key.
const SUPABASE_URL = "https://tigjghggysmmijwnewcf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Wf9nNA0HLKgKS8VvL55-dA_cJrGkrkW";

let sb = null;
const configured = !SUPABASE_URL.includes("ВСТАВЬ_") && !SUPABASE_KEY.includes("ВСТАВЬ_");
if(configured) sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const statuses=["Все","Просмотрено","Планирую","Анонс","Закончено","Жду продолжение"];
let activeStatus="Все";
let anime=[];
const demo=[
{title:"Пример аниме 1",year:"2026",voice:"AniLibria",description:"Демонстрационная запись.",status:"Просмотрено",poster_url:"https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80"},
{title:"Пример аниме 2",year:"2025",voice:"AniStar",description:"Демонстрационная запись.",status:"Планирую",poster_url:"https://images.unsplash.com/photo-1541562232579-512a21360020?auto=format&fit=crop&w=600&q=80"},
{title:"Пример аниме 3",year:"2026",voice:"Субтитры",description:"Демонстрационная запись.",status:"Жду продолжение",poster_url:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80"}];

async function loadAnime(){
 if(!sb){anime=demo; render(); return;}
 const {data,error}=await sb.from("anime").select("*").order("created_at",{ascending:false});
 if(error){console.error(error); alert("Ошибка Supabase: "+error.message); anime=[]; render(); return;}
 anime=data||[]; render();
}

function card(a){
 const i=anime.indexOf(a);
 return `<article class="card" onclick="openModal(${i})"><img src="${safe(a.poster_url||"")}" alt="" onerror="this.style.display='none'"><div class="shade"></div><div class="title">${esc(a.title)}</div></article>`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function safe(s){return String(s).replace(/"/g,"&quot;")}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const filtered=anime.filter(a=>String(a.title).toLowerCase().includes(q));
 document.getElementById("homeGrid").innerHTML=filtered.length?filtered.map(card).join(""):`<div class="empty">Ничего не найдено</div>`;
 const fav=filtered.filter(a=>activeStatus==="Все"||a.status===activeStatus);
 document.getElementById("favGrid").innerHTML=fav.length?fav.map(card).join(""):`<div class="empty">В этом разделе пока нет аниме</div>`;
 document.getElementById("tabs").innerHTML=statuses.map(s=>`<button class="tab ${s===activeStatus?'active':''}" onclick="setStatus('${s}')">${s}</button>`).join("");
 const stats={"Просмотрено":0,"Планирую":0,"Анонс":0,"Закончено":0,"Жду продолжение":0};
 anime.forEach(a=>{if(stats[a.status]!=null)stats[a.status]++});
 document.getElementById("stats").innerHTML=Object.entries(stats).map(([k,v])=>`<div class="stat"><span>${k}:</span><span>${v}</span></div>`).join("");
}
function setStatus(s){activeStatus=s;render()}
let currentIndex=-1;
function editCurrent(){ if(currentIndex<0)return; closeModal(); openEditor(anime[currentIndex]); }
function openEditor(a=null){
 document.getElementById("editorTitle").textContent=a?"Изменить аниме":"Добавить аниме";
 document.getElementById("fId").value=a?.id||""; document.getElementById("fTitle").value=a?.title||"";
 document.getElementById("fYear").value=a?.year||""; document.getElementById("fVoice").value=a?.voice||"";
 document.getElementById("fPoster").value=a?.poster_url||""; document.getElementById("fDesc").value=a?.description||"";
 document.getElementById("fStatus").value=a?.status||"Планирую";
 document.getElementById("deleteBtn").style.display=a?"block":"none"; document.getElementById("editor").classList.add("show");
}
async function saveAnime(e){
 e.preventDefault(); const payload={title:fTitle.value.trim(),year:fYear.value?Number(fYear.value):null,voice:fVoice.value.trim(),description:fDesc.value.trim(),status:fStatus.value,poster_url:fPoster.value.trim()};
 const id=fId.value;
 if(!sb){ alert("Сначала подключи Supabase в начале файла."); return; }
 let result=id?await sb.from("anime").update(payload).eq("id",id):await sb.from("anime").insert(payload);
 if(result.error){alert("Ошибка: "+result.error.message);return;}
 closeEditor(); await loadAnime();
}
async function deleteCurrent(){
 const id=fId.value;if(!id||!sb)return; if(!confirm("Удалить это аниме?"))return;
 const {error}=await sb.from("anime").delete().eq("id",id); if(error){alert("Ошибка: "+error.message);return;} closeEditor();closeModal();await loadAnime();
}
document.getElementById("animeForm").addEventListener("submit",saveAnime);
function closeEditor(){document.getElementById("editor").classList.remove("show");}

function openModal(i){
 currentIndex=i; const a=anime[i];if(!a)return;
 document.getElementById("mPoster").src=a.poster_url||"";
 document.getElementById("mTitle").textContent=a.title;
 document.getElementById("mYear").textContent=a.year||"—";
 document.getElementById("mVoice").textContent=a.voice||"—";
 document.getElementById("mDesc").textContent=a.description||"—";
 document.getElementById("mStatus").textContent=a.status||"—";
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.getElementById("search").oninput=render;
document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(btn.dataset.page).classList.add("active");
 document.getElementById("search").style.display=btn.dataset.page==="profile"?"none":"block";
});
loadAnime();
</script>
</body>
</html>
