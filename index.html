<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Library</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #09090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    color: #999;
    margin: 8px 0 0;
}


/* ==============================
   АВТОРИЗАЦИЯ
   ============================== */

.auth-panel {
    padding: 0 18px 12px;
    text-align: center;
}

.auth-user {
    color: #aaa;
    margin-bottom: 8px;
    font-size: 14px;
}

.auth-button {
    padding: 11px 18px;
    border: 0;
    border-radius: 10px;
    background: #191920;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin: 3px;
}

.auth-button:hover {
    background: #25252d;
}

.add-button {
    background: #ffd54a;
    color: #111;
    font-weight: bold;
}

.add-button:hover {
    background: #ffe27a;
}


/* ==============================
   ПОИСК
   ============================== */

.search {
    padding: 10px 18px;
}

.search input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #303038;
    background: #17171d;
    color: white;
    font-size: 16px;
    outline: none;
}


/* ==============================
   ФИЛЬТРЫ
   ============================== */

.filters {
    display: flex;
    gap: 8px;
    padding: 10px 18px 20px;
    overflow-x: auto;
}

.filters button {
    white-space: nowrap;
    padding: 10px 15px;
    border: 0;
    border-radius: 10px;
    background: #191920;
    color: white;
    cursor: pointer;
}


/* ==============================
   БИБЛИОТЕКА
   ============================== */

.library {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 0 18px 30px;
}

.card {
    background: #15151b;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
}

.card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
}

.card-info {
    padding: 10px;
}

.card-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 7px;
}

.card-meta {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.rating {
    color: #ffd54a;
}


/* ==============================
   ОБЩЕЕ ОКНО
   ============================== */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    overflow-y: auto;
    z-index: 100;
}

.modal-content {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    background: #101015;
    padding-bottom: 40px;
}

.close {
    position: fixed;
    right: 18px;
    top: 15px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 0;
    background: rgba(0,0,0,.7);
    color: white;
    font-size: 25px;
    z-index: 101;
    cursor: pointer;
}


/* ==============================
   КАРТОЧКА АНИМЕ
   ============================== */

.modal-poster {
    width: 100%;
    max-height: 600px;
    object-fit: cover;
}

.details {
    padding: 20px;
}

.details h2 {
    margin-top: 0;
    font-size: 26px;
}

.info {
    display: grid;
    gap: 8px;
    margin: 15px 0;
}

.info div {
    background: #191920;
    padding: 11px;
    border-radius: 9px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 25px;
}

.description,
.comment {
    color: #ccc;
    line-height: 1.6;
}

.continuation {
    color: #ffd54a;
}


/* ==============================
   ЗАГРУЗКА / ОШИБКА
   ============================== */

.loading {
    grid-column: 1 / -1;
    text-align: center;
    color: #888;
    padding: 50px 10px;
}

.error {
    grid-column: 1 / -1;
    text-align: center;
    color: #ff7777;
    padding: 50px 10px;
}


/* ==============================
   ФОРМА
   ============================== */

.form-box {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
}

.form-box h2 {
    margin-top: 0;
    text-align: center;
}

.form-label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #aaa;
    font-size: 14px;
}

.form-input,
.form-textarea,
.form-select {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #303038;
    background: #191920;
    color: white;
    font-size: 15px;
    outline: none;
}

.form-textarea {
    min-height: 100px;
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.form-save {
    flex: 1;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #ffd54a;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.form-cancel {
    flex: 1;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #25252d;
    color: white;
    cursor: pointer;
}

.form-message {
    text-align: center;
    margin-top: 15px;
    color: #aaa;
}


/* ==============================
   ОКНО ВХОДА
   ============================== */

.login-box {
    max-width: 400px;
    margin: 80px auto;
    padding: 25px;
    background: #15151b;
    border-radius: 16px;
}

.login-box h2 {
    margin-top: 0;
    text-align: center;
}

.login-input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #303038;
    background: #09090d;
    color: white;
    font-size: 15px;
    outline: none;
}

.login-submit {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #ffd54a;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.login-cancel {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: 0;
    border-radius: 10px;
    background: #25252d;
    color: white;
    cursor: pointer;
}

.login-message {
    margin-top: 12px;
    text-align: center;
    color: #aaa;
    line-height: 1.4;
}

</style>
</head>

<body>


<header>

    <h1>🎌 Anime Library</h1>

    <p>Моя личная библиотека аниме</p>

</header>


<!-- ==============================
     ПАНЕЛЬ АККАУНТА
     ============================== -->

<div
    class="auth-panel"
    id="authPanel">
</div>


<!-- ==============================
     ПОИСК
     ============================== -->

<div class="search">

    <input
        id="search"
        type="text"
        placeholder="🔎 Найти аниме..."
        oninput="searchAnime()"
    >

</div>


<!-- ==============================
     ФИЛЬТРЫ
     ============================== -->

<div class="filters">

    <button onclick="showAll()">
        Все
    </button>

    <button onclick="showWatched()">
        👀 Просмотрено
    </button>

    <button onclick="showFavorites()">
        ⭐ Избранное
    </button>

</div>


<!-- ==============================
     БИБЛИОТЕКА
     ============================== -->

<div
    class="library"
    id="library">
</div>


<!-- ==============================
     ОКНО АНИМЕ
     ============================== -->

<div
    class="modal"
    id="modal">

    <button
        class="close"
        onclick="closeAnime()">
        ×
    </button>

    <div
        class="modal-content"
        id="modalContent">
    </div>

</div>


<!-- ==============================
     ОКНО ВХОДА
     ============================== -->

<div
    class="modal"
    id="loginModal">

    <div class="login-box">

        <h2>🔐 Вход</h2>

        <input
            class="login-input"
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            class="login-input"
            id="loginPassword"
            type="password"
            placeholder="Пароль"
        >

        <button
            class="login-submit"
            onclick="login()">
            Войти
        </button>

        <button
            class="login-cancel"
            onclick="closeLogin()">
            Отмена
        </button>

        <div
            class="login-message"
            id="loginMessage">
        </div>

    </div>

</div>


<!-- ==============================
     ОКНО ДОБАВЛЕНИЯ
     ============================== -->

<div
    class="modal"
    id="addModal">

    <button
        class="close"
        onclick="closeAddAnime()">
        ×
    </button>

    <div class="modal-content">

        <div class="form-box">

            <h2>➕ Добавить аниме</h2>


            <label class="form-label">
                🎌 Название
            </label>

            <input
                class="form-input"
                id="addTitle"
                type="text"
                placeholder="Например: Наруто"
            >


            <label class="form-label">
                🖼️ Постер — ссылка
            </label>

            <input
                class="form-input"
                id="addPoster"
                type="url"
                placeholder="https://..."
            >


            <label class="form-label">
                📅 Год
            </label>

            <input
                class="form-input"
                id="addYear"
                type="number"
                placeholder="2026"
            >


            <label class="form-label">
                📺 Количество серий
            </label>

            <input
                class="form-input"
                id="addEpisodes"
                type="number"
                placeholder="12"
            >


            <label class="form-label">
                ⭐ Моя оценка
            </label>

            <input
                class="form-input"
                id="addRating"
                type="number"
                min="0"
                max="10"
                step="0.1"
                placeholder="9"
            >


            <label class="form-label">
                🎙️ Озвучка
            </label>

            <input
                class="form-input"
                id="addDub"
                type="text"
                placeholder="AniLibria"
            >


            <label class="form-label">
                👀 Статус
            </label>

            <select
                class="form-select"
                id="addStatus">

                <option value="Просмотрено">
                    Просмотрено
                </option>

                <option value="Смотрю">
                    Смотрю
                </option>

                <option value="Запланировано">
                    Запланировано
                </option>

                <option value="Брошено">
                    Брошено
                </option>

            </select>


            <label class="form-label">
                🔮 Продолжение
            </label>

            <input
                class="form-input"
                id="addContinuation"
                type="text"
                placeholder="Анонсировано"
            >


            <label class="form-label">
                🎭 Жанры
            </label>

            <input
                class="form-input"
                id="addGenres"
                type="text"
                placeholder="Экшен, Фэнтези, Приключения"
            >


            <label class="form-label">
                📝 Описание
            </label>

            <textarea
                class="form-textarea"
                id="addDescription"
                placeholder="Описание аниме..."
            ></textarea>


            <label class="form-label">
                💭 Моё мнение
            </label>

            <textarea
                class="form-textarea"
                id="addComment"
                placeholder="Твоё личное мнение..."
            ></textarea>


            <div class="form-actions">

                <button
                    class="form-cancel"
                    onclick="closeAddAnime()">
                    Отмена
                </button>

                <button
                    class="form-save"
                    onclick="addAnime()">
                    💾 Сохранить
                </button>

            </div>


            <div
                class="form-message"
                id="addMessage">
            </div>

        </div>

    </div>

</div>


<!-- ==============================
     SUPABASE
     ============================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* ==============================
   SUPABASE
   ============================== */

const SUPABASE_URL =
    "https://hvmvgrkoazojrpmtbnzj.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Jl93cw1rKXPSrzsoRx3mNw_euPMZEvE";



const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==============================
   ДАННЫЕ
   ============================== */

let anime = [];

let currentList = [];


/* ==============================
   ЭЛЕМЕНТЫ
   ============================== */

const library =
    document.getElementById("library");


/* ==============================
   ЗАГРУЗКА АНИМЕ
   ============================== */

async function loadAnime() {

    library.innerHTML =
        '<div class="loading">⏳ Загружаю библиотеку...</div>';


    const { data, error } =
        await supabaseClient
        .from("anime")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        library.innerHTML =
            '<div class="error">' +
            '❌ Не удалось загрузить библиотеку.' +
            '<br><br>' +
            error.message +
            '</div>';

        return;
    }


    anime = data || [];

    currentList = anime;

    render(anime);
}


/* ==============================
   ОТРИСОВКА
   ============================== */

function render(list) {

    library.innerHTML = "";

    currentList = list;


    if (list.length === 0) {

        library.innerHTML =
            '<div class="loading">' +
            'Аниме не найдено' +
            '</div>';

        return;
    }


    list.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";


        card.onclick = () =>
            openAnime(item);


        const poster =
            item.poster ||
            "https://via.placeholder.com/600x900/15151b/ffffff?text=Anime";


        card.innerHTML = `

            <img
                src="${poster}"
                alt="${item.title || "Anime"}"
            >

            <div class="card-info">

                <div class="card-title">
                    ${item.title || "Без названия"}
                </div>

                <div class="card-meta">
                    ${item.year || "—"} •
                    ${item.episodes || "—"} серий
                </div>

                <div class="card-meta rating">
                    ⭐ ${item.rating || "—"}/10
                </div>

                <div class="card-meta">
                    🎙️ ${item.dub || "—"}
                </div>

                <div class="card-meta">
                    🔮 ${item.continuation || "—"}
                </div>

            </div>

        `;


        library.appendChild(card);

    });
}


/* ==============================
   ОТКРЫТИЕ АНИМЕ
   ============================== */

function openAnime(item) {

    const modal =
        document.getElementById("modal");


    const content =
        document.getElementById("modalContent");


    const poster =
        item.poster ||
        "https://via.placeholder.com/600x900/15151b/ffffff?text=Anime";


    content.innerHTML = `

        <img
            class="modal-poster"
            src="${poster}"
            alt="${item.title || "Anime"}"
        >

        <div class="details">

            <h2>
                ${item.title || "Без названия"}
            </h2>


            <div class="info">

                <div>
                    📅 Год:
                    ${item.year || "—"}
                </div>

                <div>
                    📺 Серий:
                    ${item.episodes || "—"}
                </div>

                <div>
                    ⭐ Моя оценка:
                    ${item.rating || "—"}/10
                </div>

                <div>
                    🎙️ Озвучка:
                    ${item.dub || "—"}
                </div>

                <div>
                    👀 Статус:
                    ${item.status || "—"}
                </div>

                <div class="continuation">
                    🔮 Продолжение:
                    ${item.continuation || "—"}
                </div>

                <div>
                    🎭 Жанры:
                    ${item.genres || "—"}
                </div>

            </div>


            <div class="section-title">
                📝 Описание
            </div>

            <div class="description">
                ${item.description || "Описание отсутствует."}
            </div>


            <div class="section-title">
                💭 Моё мнение
            </div>

            <div class="comment">
                ${item.comment || "Комментарий отсутствует."}
            </div>

        </div>

    `;


    modal.style.display = "block";

    document.body.style.overflow =
        "hidden";
}


/* ==============================
   ЗАКРЫТИЕ АНИМЕ
   ============================== */

function closeAnime() {

    document.getElementById("modal")
        .style.display = "none";


    document.body.style.overflow =
        "auto";
}


/* ==============================
   ПОИСК
   ============================== */

function searchAnime() {

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!query) {

        render(anime);

        return;
    }


    const result =
        anime.filter(item => {

            const title =
                (item.title || "")
                .toLowerCase();

            return title.includes(query);
        });


    render(result);
}


/* ==============================
   ФИЛЬТРЫ
   ============================== */

function showAll() {

    render(anime);
}


function showWatched() {

    render(
        anime.filter(item =>
            item.status === "Просмотрено"
        )
    );
}


function showFavorites() {

    /*
       Избранное пока не подключено.
       Временно показываем всю библиотеку.
    */

    render(anime);
}


/* ==============================
   ОКНО ВХОДА
   ============================== */

function openLogin() {

    document.getElementById("loginModal")
        .style.display = "block";
}


function closeLogin() {

    document.getElementById("loginModal")
        .style.display = "none";

    document.getElementById("loginMessage")
        .textContent = "";
}


/* ==============================
   ВХОД
   ============================== */

async function login() {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const message =
        document
        .getElementById("loginMessage");


    if (!email || !password) {

        message.textContent =
            "⚠️ Введите Email и пароль.";

        return;
    }


    message.textContent =
        "⏳ Выполняю вход...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

        return;
    }


    message.textContent =
        "✅ Вход выполнен!";


    setTimeout(() => {

        closeLogin();

        updateAuthPanel();

    }, 500);
}


/* ==============================
   ПАНЕЛЬ АККАУНТА
   ============================== */

async function updateAuthPanel() {

    const panel =
        document.getElementById("authPanel");


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (user) {

        panel.innerHTML = `

            <div class="auth-user">
                👤 Вы вошли
            </div>

            <button
                class="auth-button add-button"
                onclick="openAddAnime()">
                ➕ Добавить аниме
            </button>

            <button
                class="auth-button"
                onclick="logout()">
                🚪 Выйти
            </button>

        `;

    } else {

        panel.innerHTML = `

            <button
                class="auth-button"
                onclick="openLogin()">
                🔐 Войти
            </button>

        `;
    }
}


/* ==============================
   ВЫХОД
   ============================== */

async function logout() {

    await supabaseClient.auth.signOut();

    updateAuthPanel();
}


/* ==============================
   ОКНО ДОБАВЛЕНИЯ
   ============================== */

function openAddAnime() {

    document.getElementById("addModal")
        .style.display = "block";

    document.getElementById("addMessage")
        .textContent = "";

    document.body.style.overflow =
        "hidden";
}


function closeAddAnime() {

    document.getElementById("addModal")
        .style.display = "none";

    document.body.style.overflow =
        "auto";
}


/* ==============================
   ДОБАВЛЕНИЕ АНИМЕ
   ============================== */

async function addAnime() {

    const message =
        document.getElementById("addMessage");


    /* Проверяем пользователя */

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        message.textContent =
            "❌ Сначала войди в аккаунт.";

        return;
    }


    /* Получаем данные */

    const title =
        document
        .getElementById("addTitle")
        .value
        .trim();


    const poster =
        document
        .getElementById("addPoster")
        .value
        .trim();


    const yearValue =
        document
        .getElementById("addYear")
        .value;


    const episodesValue =
        document
        .getElementById("addEpisodes")
        .value;


    const ratingValue =
        document
        .getElementById("addRating")
        .value;


    const dub =
        document
        .getElementById("addDub")
        .value
        .trim();


    const status =
        document
        .getElementById("addStatus")
        .value;


    const continuation =
        document
        .getElementById("addContinuation")
        .value
        .trim();


    const genres =
        document
        .getElementById("addGenres")
        .value
        .trim();


    const description =
        document
        .getElementById("addDescription")
        .value
        .trim();


    const comment =
        document
        .getElementById("addComment")
        .value
        .trim();


    /* Проверка названия */

    if (!title) {

        message.textContent =
            "⚠️ Введи название аниме.";

        return;
    }


    message.textContent =
        "⏳ Сохраняю аниме...";


    /* Данные для Supabase */

    const newAnime = {

        title: title,

        poster: poster || null,

        year: yearValue
            ? Number(yearValue)
            : null,

        episodes: episodesValue
            ? Number(episodesValue)
            : null,

        rating: ratingValue
            ? Number(ratingValue)
            : null,

        dub: dub || null,

        status: status || null,

        continuation:
            continuation || null,

        genres:
            genres || null,

        description:
            description || null,

        comment:
            comment || null

    };


    /* Отправляем в Supabase */

    const { data, error } =
        await supabaseClient
        .from("anime")
        .insert([newAnime])
        .select();


    if (error) {

        console.error(error);

        message.textContent =
            "❌ Ошибка: " +
            error.message;

        return;
    }


    /* Успешно */

    message.textContent =
        "✅ Аниме добавлено!";


    /* Очищаем форму */

    document.getElementById("addTitle").value = "";

    document.getElementById("addPoster").value = "";

    document.getElementById("addYear").value = "";

    document.getElementById("addEpisodes").value = "";

    document.getElementById("addRating").value = "";

    document.getElementById("addDub").value = "";

    document.getElementById("addStatus").value =
        "Просмотрено";

    document.getElementById("addContinuation").value = "";

    document.getElementById("addGenres").value = "";

    document.getElementById("addDescription").value = "";

    document.getElementById("addComment").value = "";


    /* Обновляем библиотеку */

    await loadAnime();


    setTimeout(() => {

        closeAddAnime();

    }, 700);
}
