<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Библиотека аниме</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #080d0b;
    --card: #101815;
    --card2: #151e1a;

    --emerald: #0f5c46;
    --emerald-light: #21a47d;

    --burgundy: #641d35;
    --burgundy-light: #92294c;

    --silver: #c8d0cd;

    --text: #edf2ef;
    --muted: #91a19a;

    --border: rgba(200, 208, 205, 0.13);
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(15, 92, 70, 0.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(100, 29, 53, 0.18),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);
    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 10;

    backdrop-filter: blur(14px);

    background: rgba(8, 13, 11, 0.88);

    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1200px;

    margin: auto;

    padding: 17px 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.logo span {
    color: var(--silver);
}

.admin-btn {
    border: 1px solid rgba(33, 164, 125, 0.45);

    background: rgba(15, 92, 70, 0.18);

    color: #dff8ee;

    border-radius: 10px;

    padding: 9px 12px;

    cursor: pointer;

    font-weight: 700;

    font-size: 12px;
}

.admin-btn:active {
    transform: scale(0.97);
}


/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;

    margin: auto;

    padding: 25px 16px 50px;
}


/* =========================
   HERO
========================= */

.hero {
    padding: 5px 0 25px;
}

.hero h1 {
    font-size: clamp(28px, 7vw, 48px);

    line-height: 1.05;

    margin-bottom: 10px;
}

.hero h1 strong {
    color: var(--emerald-light);
}

.hero p {
    color: var(--muted);

    line-height: 1.5;

    max-width: 650px;

    font-size: 14px;
}


/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: grid;

    grid-template-columns: 1fr;

    gap: 10px;

    margin-bottom: 22px;
}


/* SEARCH */

.search {
    width: 100%;

    border: 1px solid var(--border);

    background: rgba(16, 24, 21, 0.9);

    color: var(--text);

    border-radius: 12px;

    padding: 13px 15px;

    outline: none;

    font-size: 15px;
}

.search::placeholder {
    color: #718079;
}

.search:focus {
    border-color: rgba(33, 164, 125, 0.6);

    box-shadow:
        0 0 0 3px rgba(33, 164, 125, 0.08);
}


/* FILTERS */

.filters {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding-bottom: 3px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter {
    flex: 0 0 auto;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--muted);

    border-radius: 10px;

    padding: 10px 12px;

    cursor: pointer;

    font-size: 12px;
}

.filter.active {
    color: white;

    background:
        linear-gradient(
            135deg,
            var(--emerald),
            #0b3e31
        );

    border-color: rgba(33, 164, 125, 0.45);
}


/* =========================
   LIBRARY INFO
========================= */

.library-info {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;

    gap: 10px;
}

.library-info h2 {
    font-size: 18px;
}

.count {
    color: var(--muted);

    font-size: 13px;
}


/* =========================
   GRID
========================= */

.grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}


/* =========================
   CARD
========================= */

.anime-card {
    overflow: hidden;

    border: 1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            rgba(21, 30, 26, 0.98),
            rgba(10, 16, 13, 0.98)
        );

    border-radius: 14px;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease;
}

.anime-card:hover {
    transform: translateY(-3px);

    border-color:
        rgba(33, 164, 125, 0.35);
}


/* POSTER */

.poster {
    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    display: block;

    background: #17201c;
}


/* CARD BODY */

.card-body {
    padding: 11px;
}

.anime-title {
    font-size: 15px;

    font-weight: 800;

    line-height: 1.25;

    margin-bottom: 7px;
}

.meta {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.55;
}


/* STATUS */

.status {
    display: inline-block;

    margin-top: 8px;

    padding: 5px 8px;

    border-radius: 7px;

    font-size: 11px;

    font-weight: 700;

    background:
        rgba(100, 29, 53, 0.3);

    color: #eeb8c9;

    border:
        1px solid rgba(146, 41, 76, 0.3);
}


/* DESCRIPTION */

.description {
    color: #b8c3be;

    font-size: 12px;

    line-height: 1.45;

    margin-top: 8px;
}


/* EMPTY */

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 15px;

    color: var(--muted);

    border:
        1px dashed var(--border);

    border-radius: 14px;
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    color: #63716b;

    font-size: 12px;

    padding: 25px 15px;
}


/* =========================
   TABLET
========================= */

@media (min-width: 700px) {

    .toolbar {
        grid-template-columns:
            minmax(260px, 1fr) auto;

        align-items: center;
    }

    .grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 16px;
    }

    .card-body {
        padding: 14px;
    }

    .anime-title {
        font-size: 16px;
    }
}


/* =========================
   PC
========================= */

@media (min-width: 1050px) {

    .grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <div class="logo">
            ✦ <span>Библиотека аниме</span>
        </div>

        <button
            class="admin-btn"
            onclick="adminMessage()"
        >
            Войти как администратор
        </button>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Моя
            <strong>аниме-библиотека</strong>
        </h1>

        <p>
            Храни просмотренные тайтлы,
            добавляй информацию о них
            и быстро находи нужное аниме.
        </p>

    </section>



    <!-- SEARCH + FILTER -->

    <section class="toolbar">


        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔎 Найти аниме по названию..."
            autocomplete="off"
        >


        <div
            class="filters"
            id="filters"
        >

            <button
                class="filter active"
                data-status="Все"
            >
                Все
            </button>

            <button
                class="filter"
                data-status="Просмотрено"
            >
                Просмотрено
            </button>

            <button
                class="filter"
                data-status="Планирую"
            >
                Планирую
            </button>

            <button
                class="filter"
                data-status="Закончено"
            >
                Закончено
            </button>

            <button
                class="filter"
                data-status="Анонс"
            >
                Анонс
            </button>

            <button
                class="filter"
                data-status="Жду продолжение"
            >
                Жду продолжение
            </button>

        </div>

    </section>



    <!-- LIBRARY -->

    <div class="library-info">

        <h2>
            Моя коллекция
        </h2>

        <div
            class="count"
            id="count"
        >
            0 тайтлов
        </div>

    </div>


    <!-- CARDS -->

    <section
        class="grid"
        id="grid"
    ></section>


</main>



<footer>

    Библиотека аниме · Первая версия

</footer>



<script>


/* ==========================================
   ДАННЫЕ АНИМЕ

   Позже эти данные будут загружаться
   из Supabase.
========================================== */


const animeList = [


    {
        title: "Мушоку Тенсей",

        genre:
            "Фэнтези, Приключения",

        year: 2021,

        episodes: 23,

        voice:
            "AniLibria",

        status:
            "Просмотрено",

        description:
            "История Рудеуса Грейрата, который получает второй шанс на жизнь в мире магии.",

        poster:
            "https://placehold.co/600x900/101815/c8d0cd?text=Mushoku+Tensei"
    },


    {
        title: "Токийский гуль",

        genre:
            "Экшен, Ужасы, Драма",

        year: 2014,

        episodes: 12,

        voice:
            "Dream Cast",

        status:
            "Просмотрено",

        description:
            "Студент Канеки оказывается втянут в мир людей и гулей.",

        poster:
            "https://placehold.co/600x900/15100f/c8d0cd?text=Tokyo+Ghoul"
    },


    {
        title:
            "Восхождение героя щита",

        genre:
            "Фэнтези, Экшен",

        year: 2019,

        episodes: 25,

        voice:
            "AniLibria",

        status:
            "Жду продолжение",

        description:
            "Наофуми становится одним из легендарных героев и отправляется спасать новый мир.",

        poster:
            "https://placehold.co/600x900/101815/c8d0cd?text=Shield+Hero"
    },


    {
        title:
            "Мориарти-патриот",

        genre:
            "Детектив, Драма",

        year: 2020,

        episodes: 24,

        voice:
            "StudioBand",

        status:
            "Закончено",

        description:
            "История Уильяма Мориарти и его борьбы с несправедливостью.",

        poster:
            "https://placehold.co/600x900/160f13/c8d0cd?text=Moriarty"
    }


];



/* ==========================================
   ТЕКУЩИЙ ФИЛЬТР
========================================== */

let currentStatus = "Все";



/* ==========================================
   ЭЛЕМЕНТЫ СТРАНИЦЫ
========================================== */

const grid =
    document.getElementById("grid");

const search =
    document.getElementById("search");

const count =
    document.getElementById("count");



/* ==========================================
   ОТОБРАЖЕНИЕ АНИМЕ
========================================== */

function renderAnime() {


    const query =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        animeList.filter(anime => {


            const matchesTitle =
                anime.title
                    .toLowerCase()
                    .includes(query);


            const matchesStatus =
                currentStatus === "Все" ||
                anime.status === currentStatus;


            return (
                matchesTitle &&
                matchesStatus
            );

        });



    grid.innerHTML = "";



    /* Если ничего нет */

    if (filtered.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                Ничего не найдено 😔

                <br>

                Попробуй изменить
                поиск или фильтр.

            </div>

        `;

    }


    /* Если аниме найдено */

    else {

        filtered.forEach(anime => {


            const card =
                document.createElement("article");


            card.className =
                "anime-card";


            card.innerHTML = `


                <img

                    class="poster"

                    src="${anime.poster}"

                    alt="${escapeHTML(anime.title)}"

                    loading="lazy"

                >


                <div class="card-body">


                    <div class="anime-title">

                        ${escapeHTML(anime.title)}

                    </div>


                    <div class="meta">

                        ${escapeHTML(anime.genre)}

                        <br>

                        ${anime.year} год ·
                        ${anime.episodes} серий

                        <br>

                        Озвучка:
                        ${escapeHTML(anime.voice)}

                    </div>


                    <div class="status">

                        ${escapeHTML(anime.status)}

                    </div>


                    <div class="description">

                        ${escapeHTML(anime.description)}

                    </div>


                </div>

            `;


            grid.appendChild(card);

        });

    }



    /* Количество */

    count.textContent =
        filtered.length +
        " " +
        getWord(
            filtered.length,
            "тайтл",
            "тайтла",
            "тайтлов"
        );

}



/* ==========================================
   ПРАВИЛЬНОЕ ОКОНЧАНИЕ
========================================== */

function getWord(
    number,
    one,
    two,
    five
) {

    const n =
        Math.abs(number) % 100;

    const n1 =
        n % 10;


    if (
        n > 10 &&
        n < 20
    ) {
        return five;
    }


    if (
        n1 > 1 &&
        n1 < 5
    ) {
        return two;
    }


    if (n1 === 1) {
        return one;
    }


    return five;

}



/* ==========================================
   ЗАЩИТА HTML
========================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* ==========================================
   ПОИСК
========================================== */

search.addEventListener(
    "input",
    renderAnime
);



/* ==========================================
   ФИЛЬТРЫ
========================================== */

document
    .querySelectorAll(".filter")
    .forEach(button => {


        button.addEventListener(
            "click",
            () => {


                document
                    .querySelectorAll(".filter")
                    .forEach(btn => {

                        btn.classList
                            .remove("active");

                    });


                button.classList
                    .add("active");


                currentStatus =
                    button.dataset.status;


                renderAnime();

            }
        );

    });



/* ==========================================
   АДМИНКА

   Пока просто заглушка.
   Позже подключим Supabase Auth.
========================================== */

function adminMessage() {

    alert(

        "Раздел администратора пока не подключён.\n\n" +

        "На следующем этапе сделаем вход администратора " +

        "и добавление / редактирование / удаление аниме."

    );

}



/* ==========================================
   ЗАПУСК
========================================== */

renderAnime();


</script>

</body>
</html>
