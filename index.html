<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #09090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    color: #999;
    margin: 8px 0 0;
}

/* АВТОРИЗАЦИЯ */

.auth-panel {
    padding: 0 18px 10px;
    text-align: center;
}

.auth-button {
    padding: 11px 18px;
    border: 0;
    border-radius: 10px;
    background: #191920;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.auth-button:hover {
    background: #25252d;
}

.auth-user {
    color: #aaa;
    margin-bottom: 8px;
    font-size: 14px;
}

/* ПОИСК */

.search {
    padding: 10px 18px;
}

.search input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #303038;
    background: #17171d;
    color: white;
    font-size: 16px;
    outline: none;
}

/* ФИЛЬТРЫ */

.filters {
    display: flex;
    gap: 8px;
    padding: 10px 18px 20px;
    overflow-x: auto;
}

.filters button {
    white-space: nowrap;
    padding: 10px 15px;
    border: 0;
    border-radius: 10px;
    background: #191920;
    color: white;
    cursor: pointer;
}

/* БИБЛИОТЕКА */

.library {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 0 18px 30px;
}

.card {
    background: #15151b;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
}

.card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
}

.card-info {
    padding: 10px;
}

.card-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 7px;
}

.card-meta {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.rating {
    color: #ffd54a;
}

/* КАРТОЧКА АНИМЕ */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    overflow-y: auto;
    z-index: 100;
}

.modal-content {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    background: #101015;
    padding-bottom: 40px;
}

.close {
    position: fixed;
    right: 18px;
    top: 15px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 0;
    background: rgba(0,0,0,.7);
    color: white;
    font-size: 25px;
    z-index: 101;
    cursor: pointer;
}

.modal-poster {
    width: 100%;
    max-height: 600px;
    object-fit: cover;
}

.details {
    padding: 20px;
}

.details h2 {
    margin-top: 0;
    font-size: 26px;
}

.info {
    display: grid;
    gap: 8px;
    margin: 15px 0;
}

.info div {
    background: #191920;
    padding: 11px;
    border-radius: 9px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 25px;
}

.description,
.comment {
    color: #ccc;
    line-height: 1.6;
}

.continuation {
    color: #ffd54a;
}

.loading {
    grid-column: 1 / -1;
    text-align: center;
    color: #888;
    padding: 50px 10px;
}

.error {
    grid-column: 1 / -1;
    text-align: center;
    color: #ff7777;
    padding: 50px 10px;
}

/* ОКНО ВХОДА */

.login-box {
    max-width: 400px;
    margin: 80px auto;
    padding: 25px;
    background: #15151b;
    border-radius: 16px;
}

.login-box h2 {
    margin-top: 0;
    text-align: center;
}

.login-input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #303038;
    background: #09090d;
    color: white;
    font-size: 15px;
    outline: none;
}

.login-submit {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #ffd54a;
    color: #111;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.login-cancel {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: 0;
    border-radius: 10px;
    background: #25252d;
    color: white;
    cursor: pointer;
}

.login-message {
    margin-top: 12px;
    text-align: center;
    color: #aaa;
    line-height: 1.4;
}
</style>
</head>

<body>

<header>
    <h1>🎌 Anime Library</h1>
    <p>Моя личная библиотека аниме</p>
</header>

<!-- АВТОРИЗАЦИЯ -->

<div
    class="auth-panel"
    id="authPanel">
</div>


<!-- ПОИСК -->

<div class="search">
    <input
        id="search"
        type="text"
        placeholder="🔎 Найти аниме..."
        oninput="searchAnime()"
    >
</div>


<!-- ФИЛЬТРЫ -->

<div class="filters">

    <button onclick="showAll()">
        Все
    </button>

    <button onclick="showWatched()">
        👀 Просмотрено
    </button>

    <button onclick="showFavorites()">
        ⭐ Избранное
    </button>

</div>


<!-- БИБЛИОТЕКА -->

<div
    class="library"
    id="library">
</div>


<!-- ОКНО АНИМЕ -->

<div
    class="modal"
    id="modal">

    <button
        class="close"
        onclick="closeAnime()">
        ×
    </button>

    <div
        class="modal-content"
        id="modalContent">
    </div>

</div>


<!-- ОКНО ВХОДА -->

<div
    class="modal"
    id="loginModal">

    <div class="login-box">

        <h2>🔐 Вход</h2>

        <input
            class="login-input"
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            class="login-input"
            id="loginPassword"
            type="password"
            placeholder="Пароль"
        >

        <button
            class="login-submit"
            onclick="login()">
            Войти
        </button>

        <button
            class="login-cancel"
            onclick="closeLogin()">
            Отмена
        </button>

        <div
            class="login-message"
            id="loginMessage">
        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==============================
   SUPABASE
   ============================== */

const SUPABASE_URL =
    "https://hvmvgrkoazojrpmtbnzj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Jl93cw1rKXPSrzsoRx3mNw_euPMZEvE";



const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==============================
   ДАННЫЕ
   ============================== */

let anime = [];

let currentList = [];


/* ==============================
   ЭЛЕМЕНТЫ
   ============================== */

const library =
    document.getElementById("library");


/* ==============================
   ЗАГРУЗКА АНИМЕ
   ============================== */

async function loadAnime() {

    library.innerHTML =
        '<div class="loading">⏳ Загружаю библиотеку...</div>';

    const { data, error } =
        await supabaseClient
        .from("anime")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        library.innerHTML =
            '<div class="error">' +
            '❌ Не удалось загрузить библиотеку.' +
            '<br><br>' +
            error.message +
            '</div>';

        return;
    }


    anime = data || [];

    currentList = anime;

    render(anime);
}


/* ==============================
   ОТРИСОВКА
   ============================== */

function render(list) {

    library.innerHTML = "";

    currentList = list;


    if (list.length === 0) {

        library.innerHTML =
            '<div class="loading">' +
            'Аниме не найдено' +
            '</div>';

        return;
    }


    list.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.onclick = () =>
            openAnime(item);


        const poster =
            item.poster ||
            "https://via.placeholder.com/600x900/15151b/ffffff?text=Anime";


        card.innerHTML = `

            <img
                src="${poster}"
                alt="${item.title || "Anime"}"
            >

            <div class="card-info">

                <div class="card-title">
                    ${item.title || "Без названия"}
                </div>

                <div class="card-meta">
                    ${item.year || "—"} •
                    ${item.episodes || "—"} серий
                </div>

                <div class="card-meta rating">
                    ⭐ ${item.rating || "—"}/10
                </div>

                <div class="card-meta">
                    🎙️ ${item.dub || "—"}
                </div>

                <div class="card-meta">
                    🔮 ${item.continuation || "—"}
                </div>

            </div>

        `;


        library.appendChild(card);

    });
}


/* ==============================
   ОТКРЫТИЕ АНИМЕ
   ============================== */

function openAnime(item) {

    const modal =
        document.getElementById("modal");

    const content =
        document.getElementById("modalContent");


    const poster =
        item.poster ||
        "https://via.placeholder.com/600x900/15151b/ffffff?text=Anime";


    content.innerHTML = `

        <img
            class="modal-poster"
            src="${poster}"
            alt="${item.title || "Anime"}"
        >

        <div class="details">

            <h2>
                ${item.title || "Без названия"}
            </h2>


            <div class="info">

                <div>
                    📅 Год:
                    ${item.year || "—"}
                </div>

                <div>
                    📺 Серий:
                    ${item.episodes || "—"}
                </div>

                <div>
                    ⭐ Моя оценка:
                    ${item.rating || "—"}/10
                </div>

                <div>
                    🎙️ Озвучка:
                    ${item.dub || "—"}
                </div>

                <div>
                    👀 Статус:
                    ${item.status || "—"}
                </div>

                <div class="continuation">
                    🔮 Продолжение:
                    ${item.continuation || "—"}
                </div>

                <div>
                    🎭 Жанры:
                    ${item.genres || "—"}
                </div>

            </div>


            <div class="section-title">
                📝 Описание
            </div>

            <div class="description">
                ${item.description || "Описание отсутствует."}
            </div>


            <div class="section-title">
                💭 Моё мнение
            </div>

            <div class="comment">
                ${item.comment || "Комментарий отсутствует."}
            </div>

        </div>

    `;


    modal.style.display = "block";

    document.body.style.overflow =
        "hidden";
}


/* ==============================
   ЗАКРЫТИЕ АНИМЕ
   ============================== */

function closeAnime() {

    document.getElementById("modal")
        .style.display = "none";

    document.body.style.overflow =
        "auto";
}


/* ==============================
   ПОИСК
   ============================== */

function searchAnime() {

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!query) {

        render(anime);

        return;
    }


    const result =
        anime.filter(item => {

            const title =
                (item.title || "")
                .toLowerCase();

            return title.includes(query);
        });


    render(result);
}


/* ==============================
   ФИЛЬТРЫ
   ============================== */

function showAll() {

    render(anime);
}


function showWatched() {

    render(
        anime.filter(item =>
            item.status === "Просмотрено"
        )
    );
}


function showFavorites() {

    /*
       Пока избранное не настроено.
       Поэтому временно показываем
       всю библиотеку.
    */

    render(anime);
}


/* ==============================
   ВХОД
   ============================== */

function openLogin() {

    document.getElementById("loginModal")
        .style.display = "block";
}


function closeLogin() {

    document.getElementById("loginModal")
        .style.display = "none";

    document.getElementById("loginMessage")
        .textContent = "";
}


/* ==============================
   АВТОРИЗАЦИЯ
   ============================== */

async function login() {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document
        .getElementById("loginMessage");


    if (!email || !password) {

        message.textContent =
            "⚠️ Введите Email и пароль.";

        return;
    }


    message.textContent =
        "⏳ Выполняю вход...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

        return;
    }


    message.textContent =
        "✅ Вход выполнен!";


    setTimeout(() => {

        closeLogin();

        updateAuthPanel();

    }, 500);
}


/* ==============================
   ПРОВЕРКА ПОЛЬЗОВАТЕЛЯ
   ============================== */

async function updateAuthPanel() {

    const panel =
        document.getElementById("authPanel");


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (user) {

        panel.innerHTML = `

            <div class="auth-user">
                👤 Вы вошли
            </div>

            <button
                class="auth-button"
                onclick="logout()">
                🚪 Выйти
            </button>

        `;

    } else {

        panel.innerHTML = `

            <button
                class="auth-button"
                onclick="openLogin()">
                🔐 Войти
            </button>

        `;
    }
}


/* ==============================
   ВЫХОД
   ============================== */

async function logout() {

    await supabaseClient.auth.signOut();

    updateAuthPanel();
}


/* ==============================
   СЛЕЖЕНИЕ ЗА СЕССИЕЙ
   ============================== */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        updateAuthPanel();

    }
);


/* ==============================
   ЗАПУСК
   ============================== */

loadAnime();

updateAuthPanel();

</script>

</body>
    </html>
