<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Библиотека аниме</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0b0d;--panel:#151518;--panel2:#1d1d21;--text:#f4f4f5;--muted:#9b9ba3;--red:#e53935;--line:#2b2b31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{width:min(100%,980px);margin:auto;padding:18px 14px 88px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:clamp(23px,6vw,34px);margin:0;font-weight:800}.top-actions{display:flex;gap:8px}
.icon-btn,.add-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 12px}.add-btn{background:var(--red);border-color:var(--red);font-weight:700}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;outline:none;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{position:relative;min-height:155px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#202024,#121216);display:flex;align-items:flex-end;padding:11px;overflow:hidden;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:#45454d}.card-title{width:100%;font-weight:750;font-size:14px;line-height:1.25;background:rgba(0,0,0,.62);border-radius:9px;padding:8px}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:35px 10px}
nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 24px),560px);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#17171bde;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:6px;z-index:20}
nav button{background:transparent;border:0;color:var(--muted);padding:8px 4px;border-radius:11px;font-size:12px}nav button.active{background:#29292f;color:white}
.page{display:none}.page.active{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.stat b{display:block;font-size:24px;margin-top:5px}.muted{color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal-bg.show{display:flex}
.modal{width:min(100%,560px);max-height:92vh;overflow:auto;background:#141417;border:1px solid var(--line);border-radius:18px;padding:18px;position:relative}
.close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#aaa;font-size:24px}
.poster{width:min(48vw,240px);height:min(64vw,320px);object-fit:cover;border-radius:12px;display:block;margin:0 auto 15px;background:#25252a}
.info h2{font-size:23px;margin:0 30px 13px 0}.row{margin:9px 0;line-height:1.45}.label{color:#999;font-size:13px}.description{white-space:pre-wrap}
.statuses{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{border:1px solid #3b3b42;background:#202025;color:#ddd;border-radius:999px;padding:7px 10px;font-size:12px}.chip.on{background:#5e1717;border-color:var(--red);color:#fff}
.form{display:grid;gap:10px}.form input,.form textarea{width:100%;background:#0d0d10;border:1px solid var(--line);border-radius:10px;color:white;padding:11px;outline:none}.form textarea{min-height:95px;resize:vertical}.status-grid{display:flex;flex-wrap:wrap;gap:7px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.primary{background:var(--red);border:1px solid var(--red);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}.secondary{background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 14px}
.notice{font-size:12px;color:#aaa;margin:7px 0 14px}
@media(max-width:520px){.app{padding:14px 10px 88px}.grid{gap:9px}.card{min-height:135px;padding:8px}.card-title{font-size:12px;padding:7px}.poster{width:170px;height:235px}.modal{padding:15px}.stats{gap:8px}.stat{padding:11px}}
</style>
</head>
<body>
<div class="app">
<header><h1>Библиотека аниме</h1><div class="top-actions"><button class="add-btn" id="addBtn">＋ Добавить</button></div></header>

<section id="home" class="page active">
<input id="search" class="search" placeholder="🔎 Поиск аниме...">
<div id="homeGrid" class="grid"></div>
</section>

<section id="favorites" class="page">
<h2>👍 Избранное</h2>
<p class="notice">Один тайтл может иметь сразу несколько статусов.</p>
<div id="favGrid" class="grid"></div>
</section>

<section id="profile" class="page">
<h2>Профиль</h2>
<div class="stats" id="stats"></div>
</section>
</div>

<nav>
<button class="active" data-page="home">🏠<br>Главная</button>
<button data-page="favorites">👍<br>Избранное</button>
<button data-page="profile">👤<br>Профиль</button>
</nav>

<div class="modal-bg" id="detailsBg"><div class="modal">
<button class="close" id="detailsClose">×</button><div id="details"></div>
</div></div>

<div class="modal-bg" id="formBg"><div class="modal">
<button class="close" id="formClose">×</button>
<h2 id="formTitle">Добавить аниме</h2>
<div class="form">
<input id="fTitle" placeholder="Название *">
<input id="fYear" type="number" placeholder="Год">
<input id="fVoice" placeholder="Озвучка">
<input id="fPoster" placeholder="URL постера (необязательно)">
<textarea id="fDesc" placeholder="Описание"></textarea>
<div><div class="label">Статусы</div><div class="status-grid" id="statusGrid"></div></div>
</div>
<div class="actions"><button class="secondary" id="cancelForm">Отмена</button><button class="primary" id="saveAnime">Сохранить</button></div>
</div></div>

<script>
/* ВСТАВЬТЕ СЮДА ДВА ЗНАЧЕНИЯ ИЗ SUPABASE:
   Settings → API → Project URL
   и Publishable key (или старый anon key).
   НЕ вставляйте service_role key.
*/
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const ready = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_KEY.startsWith("YOUR_");
const sb = ready ? supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;

const STATUSES=["Просмотрено","Планирую","Анонс","Закончено","Жду продолжение"];
let anime=[], editingId=null, selectedStatuses=new Set();

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function chips(statuses,interactive=false){
 return STATUSES.map(s=>`<button type="button" class="chip ${statuses?.includes(s)?"on":""}" ${interactive?`data-status="${esc(s)}"`:""}>${esc(s)}</button>`).join("");
}
function card(a){
 return `<button class="card" data-id="${a.id}"><span class="card-title">${esc(a.title)}</span></button>`;
}
function renderGrid(target,list){
 $(target).innerHTML=list.length?list.map(card).join(""):`<div class="empty">Пока здесь ничего нет.</div>`;
 $(target).querySelectorAll(".card").forEach(x=>x.onclick=()=>openDetails(x.dataset.id));
}
function render(){
 const q=$("search").value.trim().toLowerCase();
 renderGrid("homeGrid",anime.filter(a=>a.title.toLowerCase().includes(q)));
 renderGrid("favGrid",anime.filter(a=>(a.statuses||[]).length));
 const counts=Object.fromEntries(STATUSES.map(s=>[s,anime.filter(a=>(a.statuses||[]).includes(s)).length]));
 $("stats").innerHTML=STATUSES.map(s=>`<div class="stat">${esc(s)}<b>${counts[s]}</b></div>`).join("");
}
async function load(){
 if(!ready){anime=[];render();return}
 const {data,error}=await sb.from("anime").select("*").order("created_at",{ascending:false});
 if(error){console.error(error);alert("Ошибка загрузки Supabase: "+error.message);return}
 anime=data||[];render();
}
function openDetails(id){
 const a=anime.find(x=>String(x.id)===String(id));if(!a)return;
 $("details").innerHTML=`
 ${a.poster_url?`<img class="poster" src="${esc(a.poster_url)}" onerror="this.style.display='none'">`:""}
 <div class="info"><h2>${esc(a.title)}</h2>
 <div class="row"><span class="label">Год:</span><br>${esc(a.year||"—")}</div>
 <div class="row"><span class="label">Озвучка:</span><br>${esc(a.voice||"—")}</div>
 <div class="row"><span class="label">Описание:</span><br><span class="description">${esc(a.description||"—")}</span></div>
 <div class="row"><span class="label">Статусы:</span><div class="statuses">${chips(a.statuses||[])}</div></div>
 <div class="actions"><button class="secondary" onclick="editAnime('${a.id}')">Изменить</button><button class="secondary" onclick="deleteAnime('${a.id}')">Удалить</button></div>
 </div>`;
 $("detailsBg").classList.add("show");
}
function openForm(a=null){
 editingId=a?.id||null; selectedStatuses=new Set(a?.statuses||[]);
 $("formTitle").textContent=a?"Изменить аниме":"Добавить аниме";
 $("fTitle").value=a?.title||"";$("fYear").value=a?.year||"";$("fVoice").value=a?.voice||"";
 $("fPoster").value=a?.poster_url||"";$("fDesc").value=a?.description||"";
 $("statusGrid").innerHTML=chips([...selectedStatuses],true);
 $("statusGrid").querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{const s=b.dataset.status;selectedStatuses.has(s)?selectedStatuses.delete(s):selectedStatuses.add(s);b.classList.toggle("on");});
 $("formBg").classList.add("show");
}
window.editAnime=id=>{const a=anime.find(x=>String(x.id)===String(id));$("detailsBg").classList.remove("show");openForm(a)};
window.deleteAnime=async id=>{
 if(!confirm("Удалить это аниме?"))return;
 if(ready){const {error}=await sb.from("anime").delete().eq("id",id);if(error)return alert(error.message)}
 anime=anime.filter(x=>String(x.id)!==String(id));$("detailsBg").classList.remove("show");render();
};
$("saveAnime").onclick=async()=>{
 const title=$("fTitle").value.trim();if(!title)return alert("Введите название.");
 const payload={title,year:$("fYear").value?Number($("fYear").value):null,voice:$("fVoice").value.trim(),poster_url:$("fPoster").value.trim(),description:$("fDesc").value.trim(),statuses:[...selectedStatuses]};
 if(ready){
  let res=editingId?await sb.from("anime").update(payload).eq("id",editingId).select().single():await sb.from("anime").insert(payload).select().single();
  if(res.error)return alert(res.error.message);
  if(editingId)anime=anime.map(x=>String(x.id)===String(editingId)?res.data:x);else anime.unshift(res.data);
 }else{
  const local={id:crypto.randomUUID(),...payload,created_at:new Date().toISOString()};editingId?anime=anime.map(x=>x.id===editingId?local:x):anime.unshift(local);
 }
 $("formBg").classList.remove("show");render();
};
$("search").oninput=render;$("addBtn").onclick=()=>openForm();$("cancelForm").onclick=()=>$("formBg").classList.remove("show");
$("formClose").onclick=()=>$("formBg").classList.remove("show");$("detailsClose").onclick=()=>$("detailsBg").classList.remove("show");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(b.dataset.page).classList.add("active");render()});
load();
</script>
</body></html>
